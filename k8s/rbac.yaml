apiVersion: v1
kind: ServiceAccount
metadata:
  name: cilium-repro-orchestrator
  namespace: cilium-repro
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cilium-repro-job-manager
  namespace: cilium-repro
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cilium-repro-orchestrator-binding
  namespace: cilium-repro
subjects:
  - kind: ServiceAccount
    name: cilium-repro-orchestrator
    namespace: cilium-repro
roleRef:
  kind: Role
  name: cilium-repro-job-manager
  apiGroup: rbac.authorization.k8s.io
